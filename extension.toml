# Rojo: serving Roblox projects to Studio, building them, and keeping the
# sourcemap luau-lsp reads; the project's instances in a view and the
# explorer; schemas for project, meta, and model files made from Roblox's
# API; and Rokit and Wally. See Flareite's docs/extensions.md.
id = "flareite.rojo"
name = "Rojo"
version = "1.0.0"
description = "Roblox projects with Rojo: serve to Studio, build, sourcemaps, the instance tree, checked project files, and Rokit and Wally."
author = "Flareite"
icon = "icon.svg"
api_version = "2"
entrypoint = "target/wasm32-unknown-unknown/release/rojo.wasm"
# In Rojo projects, and folders with Rokit or Wally tools.
activation = [
  "on-folder-contains:*.project.json",
  "on-folder-contains:rokit.toml",
  "on-folder-contains:wally.toml",
  "on-view:projects",
  "on-view:instances",
]
# Looks at the folder again as it changes, and follows the settings.
events = ["folder-changed", "configuration-changed"]

[engines]
flareite = ">=0.1.0"

# files_read: project files, sourcemap.json, rokit.toml, and wally.toml, and
# watching them. processes: Rojo, Rokit, Wally, and wally-package-types;
# and opening a built place in Roblox Studio. network: Roblox's API, for
# checking project files.
[permissions]
files_read = true
processes = true
network = true

[build]
command = "cargo"
args = ["build", "--release"]
watch = ["src", "Cargo.toml"]

# Installed with Rokit (rokit add rojo-rbx/rojo), or from their releases.
[[programs]]
name = "rojo"

[[programs]]
name = "rokit"

[[programs]]
name = "wally"

[[programs]]
name = "wally-package-types"

[[status_items]]
id = "serve"
alignment = "left"
