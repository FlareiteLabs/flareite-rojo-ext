[configuration.project]
type = "string"
default = "default.project.json"
description = "The project file, in the open folder, that sourcemaps are made from and that's served when there are several. Without it, the first project file found is used."

[configuration.sourcemap]
type = "boolean"
default = true
description = "Keep sourcemap.json up to date with `rojo sourcemap --watch`, for luau-lsp (the Luau extension) to resolve requires and instances, and for the Instances view and explorer marks."

[configuration.sourcemap_include_non_scripts]
type = "boolean"
default = true
description = "Include instances that aren't scripts (models, folders, values) in the sourcemap, so their paths complete and show in the Instances view."

[configuration.serve_port]
type = "integer"
default = 0
minimum = 0
maximum = 65535
description = "The port `rojo serve` listens on; 0 for the project's `servePort`, or 34872."

[configuration.explorer_marks]
type = "boolean"
default = true
description = "Mark files in the explorer with the Roblox instances they become: SS (Script), LS (LocalScript), and MS (ModuleScript), and the class of others in their tooltips."

[configuration.wally_prompt]
type = "boolean"
default = true
description = "When wally.toml changes, offer to run `wally install`."

[[schemas]]
files = ["rokit.toml"]
path = "schemas/rokit.json"

[[schemas]]
files = ["wally.toml"]
path = "schemas/wally.json"
